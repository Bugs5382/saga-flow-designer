name: Node CI
# Build/lint/test gate for the npm package. Mirrors what the local pre-push hook
# runs (lint/test), plus typecheck and build, so every PR is verified.
#
# Pull requests only, and not while the PR is a draft; the PR run covers what
# merges, so nothing reruns on push to main or on branch pushes without a PR.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test:
    name: Build & Test
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # Fails if the tarball would ship source maps or non-runtime folders, or
      # grows past the size ceiling in scripts/checkPack.mjs.
      - name: Check package contents
        run: npm run check:pack
