name: License Check
# Fail if a 3rd-party npm dependency carries a license outside the allowlist.
# The manifest check lives in a step (hashFiles() is not valid in a job-level
# `if` -- there is no workspace before checkout). No SAST/vuln scanning
# (deliberately out of scope).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  npm:
    name: 📜 npm dependency licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect package.json
        id: manifest
        run: |
          if [ -f package.json ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false (skipping)"; echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node
        if: steps.manifest.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        if: steps.manifest.outputs.found == 'true'
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check dependency licenses
        if: steps.manifest.outputs.found == 'true'
        run: |
          npx --yes license-checker-rseidelsohn \
            --production --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0;MPL-2.0;CC-BY-4.0"
