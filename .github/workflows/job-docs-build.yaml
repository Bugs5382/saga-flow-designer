name: Docs Build
# Build the Docusaurus documentation site (website/) on every PR and on push to
# main, so the docs never break silently.
#
# The shared brand theme @the-rabbit-hole-tech/docs-theme is vendored into
# website/vendor/ and consumed as a local file: dependency, so this build needs
# no registry auth or secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: 📚 Build docs site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
