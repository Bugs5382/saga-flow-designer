name: Storybook Build
# Build the Storybook (and confirm the mock-gateway-driven stories compile) on
# every PR and on push to main, so the demo harness never breaks silently. Uses
# only public dependencies - no registry auth or secrets required.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: 📖 Build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build Storybook
        run: npm run build-storybook
